<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>STITCH 临床工作台 - 登录</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Public+Sans:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#eef1f2",
                        "surface-dim": "#d7dadb",
                        "on-surface": "#181c1d",
                        "surface-container-high": "#e5e9ea",
                        "surface-tint": "#19686d",
                        "on-tertiary-container": "#ffb68b",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdbc9",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#3f4849",
                        "on-secondary-fixed": "#071e27",
                        "primary": "#004347",
                        "surface-bright": "#f7fafb",
                        "on-tertiary-fixed": "#321200",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#004f53",
                        "surface-container-low": "#f1f4f5",
                        "outline": "#6f797a",
                        "surface": "#f7fafb",
                        "surface-container": "#ebeeef",
                        "outline-variant": "#bec8c9",
                        "on-tertiary-fixed-variant": "#6c3a19",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed": "#002022",
                        "primary-fixed": "#a8eff4",
                        "secondary-fixed-dim": "#b4cad6",
                        "inverse-primary": "#8cd2d7",
                        "on-primary-container": "#8cd2d7",
                        "error": "#ba1a1a",
                        "secondary-container": "#cfe6f2",
                        "on-error-container": "#93000a",
                        "surface-variant": "#e0e3e4",
                        "inverse-surface": "#2d3132",
                        "tertiary-fixed-dim": "#ffb68c",
                        "on-error": "#ffffff",
                        "secondary": "#4c616c",
                        "primary-fixed-dim": "#8cd2d7",
                        "primary-container": "#005c61",
                        "surface-container-highest": "#e0e3e4",
                        "secondary-fixed": "#cfe6f2",
                        "on-secondary-container": "#526772",
                        "on-secondary": "#ffffff",
                        "on-background": "#181c1d",
                        "on-secondary-fixed-variant": "#354a53",
                        "tertiary": "#5e2f0e",
                        "background": "#f7fafb",
                        "tertiary-container": "#7a4523"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Public Sans", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
        }
        
        .bg-clinical-pattern {
            background-image: radial-gradient(#bec8c9 1px, transparent 1px);
            background-size: 24px 24px;
            background-position: -12px -12px;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center p-6 relative overflow-hidden bg-clinical-pattern">
<!-- Decorative Ambient Orbs -->
<div class="absolute top-[-10%] left-[-5%] w-96 h-96 bg-primary-fixed opacity-30 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-5%] w-[30rem] h-[30rem] bg-secondary-fixed opacity-40 rounded-full blur-[120px] pointer-events-none"></div>
<!-- Login Container -->
<div class="w-full max-w-md relative z-10">
<!-- Brand Anchor -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-surface-container-lowest rounded-full flex items-center justify-center mb-4 shadow-[0_12px_32px_-4px_rgba(24,28,29,0.06)] ring-1 ring-outline-variant/20">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">neurology</span>
</div>
<h1 class="font-headline font-black text-4xl text-primary tracking-tight mb-2">STITCH</h1>
<p class="font-label text-sm text-on-surface-variant uppercase tracking-[0.2em] font-medium">临床工作台</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 shadow-[0_12px_32px_-4px_rgba(24,28,29,0.06)] relative overflow-hidden">
<!-- Subtle Gradient Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-container"></div>
<div class="mb-8">
<h2 class="font-headline text-xl font-bold text-on-surface mb-2">系统认证</h2>
<p class="font-body text-sm text-on-surface-variant">请输入您的凭据以访问安全环境。</p>
</div>
<form class="space-y-6">
<!-- Physician/Staff ID Field -->
<div>
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="staff_id">医生/职员 ID</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">badge</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-0 bg-surface-container-low text-on-surface rounded-lg font-body text-sm placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors duration-200" id="staff_id" name="staff_id" placeholder="输入您的职工编号" required="" type="text"/>
</div>
</div>
<!-- Access Key Field -->
<div>
<label class="block font-label text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2" for="access_key">访问密钥</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">key</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border-0 bg-surface-container-low text-on-surface rounded-lg font-body text-sm placeholder:text-outline focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-colors duration-200" id="access_key" name="access_key" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-2">
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg text-sm font-medium text-on-primary bg-gradient-to-b from-primary to-primary-container hover:from-primary-container hover:to-[#004f53] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all duration-200 shadow-sm" type="button">
<span class="material-symbols-outlined mr-2 text-[18px]">login</span>
                            安全登录
                        </button>
</div>
</form>
<!-- Clinical Disclaimer -->
<div class="mt-8 pt-6 border-t border-outline-variant/20 flex items-start space-x-3">
<span class="material-symbols-outlined text-outline text-[18px] mt-0.5">warning</span>
<p class="font-body text-xs text-on-surface-variant leading-relaxed">
                        仅限授权人员访问。此系统包含受保护的健康信息（PHI）。所有活动均被记录并监控，以确保符合临床数据治理标准。
                    </p>
</div>
</div>
</div>
</main>
<!-- Footer System Status -->
<footer class="bg-surface-container-low py-3 px-6 shrink-0 relative z-20 shadow-[0_-4px_24px_rgba(24,28,29,0.02)]">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between font-label text-xs text-on-surface-variant uppercase tracking-wider gap-4 md:gap-0">
<div class="flex items-center space-x-6">
<!-- System Status -->
<div class="flex items-center space-x-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<span>系统在线</span>
</div>
<!-- Demo Mode Chip -->
<div class="flex items-center space-x-1.5 px-2 py-0.5 bg-secondary-container text-on-secondary-container rounded-DEFAULT">
<span class="material-symbols-outlined text-[14px]">science</span>
<span class="font-semibold">演示模式</span>
</div>
</div>
<div class="flex items-center space-x-6">
<!-- Model Status -->
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[14px] text-primary">analytics</span>
<span>模型状态: 健康</span>
</div>
<!-- Database -->
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[14px] text-primary">database</span>
<span>数据库: MySQL</span>
</div>
</div>
</div>
</footer>
</body></html>
